# Lading joins the node's existing network so the edge reaches it as
# http://lading:3600. Nothing is published on the host. Same shape as anonfetch
# and gas-station: its own compose project, zero changes to the node stack.
services:
  lading:
    build: .
    container_name: lading
    restart: unless-stopped
    expose: ['3600']
    environment:
      PORT: '3600'
      MAX_BODY_BYTES: '3145728'
      LADING_EVM_PRIVATE_KEY: ${LADING_EVM_PRIVATE_KEY}        # Base key holding USDC; pays Lighthouse per upload
      LADING_FILECOIN_PRIVATE_KEY: ${LADING_FILECOIN_PRIVATE_KEY:-}   # Filecoin key with USDFC deposited in Filecoin Pay (npm run fund:filecoin); door OFF when unset
      LADING_FILECOIN_CHAIN: ${LADING_FILECOIN_CHAIN:-mainnet}
      LADING_FILECOIN_COPIES: ${LADING_FILECOIN_COPIES:-2}
      LADING_FILECOIN_MIN_RUNWAY_DAYS: ${LADING_FILECOIN_MIN_RUNWAY_DAYS:-7}
      LADING_ANT_ID: ${LADING_ANT_ID}                          # ANT the undernames live on
      LADING_ARNS_BASE_NAME: ${LADING_ARNS_BASE_NAME}          # e.g. boughtviatoonnode
      LADING_ARNS_GATEWAY: ${LADING_ARNS_GATEWAY:-permagate.io}
      LADING_SOLANA_KEYPAIR: ${LADING_SOLANA_KEYPAIR}          # JSON array; the ANT owner's key
      SOLANA_RPC: ${SOLANA_RPC:-https://api.mainnet-beta.solana.com}
      LADING_NODE_SECRET: ${LADING_NODE_SECRET:-}
      LADING_DATA_DIR: /data                                   # the walrus ledger: every Lighthouse record this broker paid for, and when it runs out
    volumes: [lading_data:/data]
    networks: [relay_deploy_net]
volumes:
  lading_data:
networks:
  relay_deploy_net:
    external: true
