# Add to the edge connector's config. One door per price: the connector refuses
# one handler_url at two prices, and a reject is still charged, so each door
# only sells what it can deliver.

# Walrus leg. Flat: Lighthouse bills on the erasure-coded size, so every upload
# up to the 2 MiB packet cap costs about $0.032 to $0.036 downstream. 40,000
# base units = $0.04 USDC, a thin margin over that floor.
[[routes]]
prefix = "g.drew.lading.walrus"
handler_url = "http://lading:3600/walrus"
price = 40000

# Filecoin leg. Filecoin Onchain Cloud: the provider takes a one-time add-piece
# fee of about $0.011 per copy (two copies by default), and the broker's data
# set carries a shared $0.12/month proving fee plus $2.50/TiB/month per copy.
# 30,000 base units = $0.03, a thin margin over the per-object cost.
[[routes]]
prefix = "g.drew.lading.filecoin"
handler_url = "http://lading:3600/filecoin"
price = 30000

# IPFS leg. Pinata's x402 door prices a pin at 0.10 USDC per GiB for twelve
# months, floored at 0.001 USDC, so every part up to the packet cap costs the
# broker 0.001 to 0.004 USDC. 5,000 base units = $0.005, a thin margin over the
# per-part ceiling.
[[routes]]
prefix = "g.drew.lading.ipfs"
handler_url = "http://lading:3600/ipfs"
price = 5000

# Name leg. One Solana transaction on the broker's ANT per job. 5,000 = $0.005.
[[routes]]
prefix = "g.drew.lading.name"
handler_url = "http://lading:3600/name"
price = 5000

# The Arweave leg and the manifest write ride the existing g.drew.ario route
# (schedule {base 1000, per_kib 30}); the relay copy rides g.drew.relay (1000).

# Quote doors, 1,000 each: "would this leg go through right now". The walrus
# quote reads the Lighthouse price for the size and the Base key's USDC; the
# filecoin quote reads the broker's Filecoin Pay account (deposit needed,
# runway in days); the name quote reads the name key's lamports and its ANT
# authority. A caller risks 1,000 here instead of 40,000, 30,000 or 5,000 on
# a leg that would fail.
[[routes]]
prefix = "g.drew.lading.walrus.quote"
handler_url = "http://lading:3600/walrus/quote"
price = 1000

[[routes]]
prefix = "g.drew.lading.filecoin.quote"
handler_url = "http://lading:3600/filecoin/quote"
price = 1000

[[routes]]
prefix = "g.drew.lading.name.quote"
handler_url = "http://lading:3600/name/quote"
price = 1000

[[routes]]
prefix = "g.drew.lading.ipfs.quote"
handler_url = "http://lading:3600/ipfs/quote"
price = 1000

# Walrus renewal: one more year on a record the broker paid Lighthouse for.
# Lighthouse lets only the paying wallet renew, and that is the broker's Base
# key for every record sold through g.drew.lading.walrus, so the broker is the
# one party that can. Same downstream price as an upload (billed on the
# erasure-coded size), so the same flat 40,000. The quote door reads
# Lighthouse's own renew price and the record's current paid-through date.
[[routes]]
prefix = "g.drew.lading.walrus.renew"
handler_url = "http://lading:3600/walrus/renew"
price = 40000

[[routes]]
prefix = "g.drew.lading.walrus.renew.quote"
handler_url = "http://lading:3600/walrus/renew/quote"
price = 1000

# Native Walrus extension: more epochs on a blob object the broker's Sui key
# owns (every record written by walrus-native). One Sui transaction paying
# WAL for storage only, so cheaper downstream than a write; same flat price
# as a renewal at the door. The quote door reads the object and the epoch
# timing on chain.
[[routes]]
prefix = "g.drew.lading.walrus.extend"
handler_url = "http://lading:3600/walrus/extend"
price = 40000

[[routes]]
prefix = "g.drew.lading.walrus.extend.quote"
handler_url = "http://lading:3600/walrus/extend/quote"
price = 1000
